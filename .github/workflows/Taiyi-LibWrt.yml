name: Taiyi-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #  - cron: "0 18 * * 5"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/LiBwrt/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/Taiyi.config
      firmware_tag: Taiyi-LibWrt
      kernel_file: kernel-6.12
      artifact_prefix: Taiyi
      manifest_file: libwrt-qualcommax-ipq60xx-jdcloud_re-cs-07.manifest
      release_summary: >-
        这是开启全功能NSS的6.12内核固件，默认主题为Aurora；该固件在LibWrt的基础上，添加了额外的软件包cpufreq、ddns、upnp、wol、samba4、vlmcsd、aria2、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、openlist2、wireguard、watchcat、3cat、passwall、gecoosac，并添加了若干工具，具体详见Taiyi.config和General.config。
